[package]
name = "gridbench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gridbench"
path = "src/main.rs"

[[bin]]
name = "fast_arith"
path = "src/fast_arith.rs"

[[bin]]
name = "arith_grid"
path = "src/arith_grid.rs"

[[bin]]
name = "grammar_grid"
path = "src/grammar_grid.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
