name: grid-bench

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Lookup grids and activation tables
        run: ./target/release/gridbench
      - name: Hindi grammar tables
        run: ./target/release/grammar_grid
      - name: Machine
        run: |
          nproc
          grep -E "model name" /proc/cpuinfo | head -1 || true
